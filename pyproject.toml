[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inids"
version = "0.1.0"
description = "Intelligent Network Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "Flask>=3.0.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "joblib>=1.3.0",
  "numpy>=1.24.0",
  "pytest>=7.4.0",
  "Werkzeug>=3.0.0",
  "Jinja2>=3.1.0",
  "scapy>=2.5.0",
  "requests>=2.31.0",
]

[tool.setuptools]
packages = ["src", "web_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/auth", "src/detection", "src/ips"]
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
# Gate: auth ≥ 80% (currently 91%), detection ≥ 70%, ips ≥ 70% (F-Step-40 baseline).
# Raise to 80 once threshold_engine, signature_engine, action_executor coverage improves.
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
