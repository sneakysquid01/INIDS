name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 02:00 UTC to catch newly published CVEs
    - cron: "0 2 * * *"

jobs:
  pip-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies (A-07)
        # Fail the build if any known CVE is found in pinned dependencies.
        # Use --no-deps to only check what is explicitly listed in requirements.txt.
        run: pip-audit --require-hashes --no-deps -r requirements.txt

  pip-compile-drift:
    name: Requirements Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Recompile and check for drift (FIX-025)
        run: |
          pip-compile --generate-hashes --output-file=requirements.lock.check requirements.in
          diff -u requirements.txt requirements.lock.check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with hash verification (A-07)
        run: pip install --require-hashes --no-deps -r requirements.txt

      - name: Install pytest-cov
        run: pip install pytest-cov

      - name: Run tests with coverage gate (FIX-011)
        run: |
          python -m pytest --tb=short -q \
            --cov=src/auth --cov=src/detection --cov=src/ips \
            --cov=src/ops_store --cov=src/middleware --cov=web_app \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=50

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
