<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INIDS — Sign In</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #090c12;
            color: rgba(255,255,255,0.85);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo .shield {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .login-logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #fff;
        }

        .login-logo p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.25rem;
            letter-spacing: 0.05em;
        }

        .login-card {
            background: #151922;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 2rem;
        }

        .login-card h2 {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .input-wrap {
            position: relative;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: #0f1117;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 0.75rem 2.5rem 0.75rem 1rem;
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            outline: none;
            transition: border-color 0.15s;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .toggle-vis {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1rem;
            transition: color 0.15s;
        }

        .toggle-vis:hover { color: rgba(255,255,255,0.7); }

        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            margin-top: 0.25rem;
        }

        .btn-login:hover { background: #2563eb; }
        .btn-login:active { transform: scale(0.98); }

        .error-box {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #f87171;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hint {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .hint p {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            margin-bottom: 0.4rem;
        }

        .hint code {
            display: block;
            background: #0f1117;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.5);
            word-break: break-all;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .hint code:hover {
            border-color: rgba(59,130,246,0.4);
            color: rgba(255,255,255,0.7);
        }

        .copied-msg {
            font-size: 0.7rem;
            color: #10b981;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-logo">
            <span class="shield">🛡</span>
            <h1>INIDS</h1>
            <p>INTRUSION DETECTION SYSTEM</p>
        </div>

        <div class="login-card">
            <h2>Sign in with your API key</h2>

            {% if error %}
            <div class="error-box">
                <i class="bi bi-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="next" value="{{ next_url }}">

                <div class="form-group">
                    <label for="api_key">API Key</label>
                    <div class="input-wrap">
                        <input
                            type="password"
                            id="api_key"
                            name="api_key"
                            placeholder="Paste your API key here…"
                            autocomplete="current-password"
                            autofocus
                        >
                        <button type="button" class="toggle-vis" onclick="toggleVis()" title="Show/hide">
                            <i class="bi bi-eye" id="vis-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-shield-lock me-1"></i> Sign In
                </button>
            </form>

            <div class="hint">
                <p>Available API keys (from <code style="display:inline;padding:1px 4px;font-size:0.72rem">.env</code>):</p>

                <p style="margin-top:0.75rem;margin-bottom:0.25rem">Admin (full access):</p>
                <code id="admin-key" onclick="copyKey('admin-key')" title="Click to copy">{{ admin_key }}</code>
                <div class="copied-msg" id="admin-key-msg">Copied!</div>

                <p style="margin-top:0.75rem;margin-bottom:0.25rem">Viewer (read-only):</p>
                <code id="viewer-key" onclick="copyKey('viewer-key')" title="Click to copy">{{ viewer_key }}</code>
                <div class="copied-msg" id="viewer-key-msg">Copied!</div>
            </div>
        </div>
    </div>

    <script>
        function toggleVis() {
            const input = document.getElementById('api_key');
            const icon = document.getElementById('vis-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        function copyKey(id) {
            const text = document.getElementById(id).textContent.trim();
            navigator.clipboard.writeText(text).then(() => {
                document.getElementById(id + '-msg').style.display = 'block';
                setTimeout(() => { document.getElementById(id + '-msg').style.display = 'none'; }, 2000);
                // Also fill the API key field
                document.getElementById('api_key').value = text;
                document.getElementById('api_key').type = 'text';
                document.getElementById('vis-icon').className = 'bi bi-eye-slash';
            });
        }
    </script>
</body>
</html>
