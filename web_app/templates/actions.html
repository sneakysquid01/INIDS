{% extends "base.html" %}

{% block title %}Actions — INIDS 3.0{% endblock %}
{% block page_title %}Actions{% endblock %}

{% block content %}
<div class="flex flex-col h-screen bg-[#0a0c10]">
    <!-- PAGE HEADER -->
    <div class="mb-6">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-white font-syne">Actions</h1>
                <p class="text-[#8f9099] text-sm mt-1">System prevention actions and enforcement history</p>
            </div>
            <div id="action-stats" class="flex gap-4">
                <div class="bg-[#151922] border border-[#1a1f2e] rounded-lg px-4 py-2">
                    <div class="text-[#8f9099] text-xs uppercase tracking-wider">Total Actions</div>
                    <div id="stat-total" class="text-2xl font-bold text-white mt-1">0</div>
                </div>
                <div class="bg-[#151922] border border-[#1a1f2e] rounded-lg px-4 py-2">
                    <div class="text-[#8f9099] text-xs uppercase tracking-wider">Successful</div>
                    <div id="stat-success" class="text-2xl font-bold text-[#10b981] mt-1">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- FILTER BAR -->
    <div class="bg-[#151922] border border-[#1a1f2e] rounded-lg p-4 mb-6">
        <div class="grid grid-cols-2 gap-4">
            <!-- TYPE FILTERS -->
            <div>
                <div class="text-xs font-semibold text-[#8f9099] uppercase tracking-wider mb-3">Action Type</div>
                <div id="type-filters" class="flex flex-wrap gap-2">
                    <button class="type-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#3b82f6] active:bg-[#3b82f6]" data-type="all">All Types</button>
                    <button class="type-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#ef4444]" data-type="block">Block</button>
                    <button class="type-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#10b981]" data-type="unblock">Unblock</button>
                    <button class="type-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#f59e0b]" data-type="alert">Alert</button>
                    <button class="type-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#8b5cf6]" data-type="respond">Respond</button>
                </div>
            </div>

            <!-- STATUS FILTERS -->
            <div>
                <div class="text-xs font-semibold text-[#8f9099] uppercase tracking-wider mb-3">Status</div>
                <div id="status-filters" class="flex flex-wrap gap-2">
                    <button class="status-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#3b82f6] active:bg-[#3b82f6]" data-status="all">All Status</button>
                    <button class="status-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#10b981]" data-status="success">Success</button>
                    <button class="status-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#ef4444]" data-status="failed">Failed</button>
                    <button class="status-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#f59e0b]" data-status="pending">Pending</button>
                </div>
            </div>
        </div>

        <!-- SEARCH INPUT -->
        <div class="mt-4">
            <input 
                id="search-actions" 
                type="text" 
                placeholder="Search by target IP, domain, or reason..."
                class="w-full px-3 py-2 bg-[#0a0c10] border border-[#1a1f2e] rounded text-white text-sm placeholder-[#6b7280] focus:outline-none focus:border-[#3b82f6]"
            />
        </div>
    </div>

    <!-- ACTIONS CONTAINER -->
    <div class="flex-1 overflow-y-auto">
        <div id="actions-list" class="space-y-4 pb-6">
            <!-- ActionCard components mount here -->
        </div>
    </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/pages/actions.page.js') }}"></script>
{% endblock %}
