{% extends "modules/base_module.html" %}

{% block module_content %}
<div class="policy-enforcement-module">
    <div class="policy-stats">
        <div class="stat-card">
            <div class="stat-label">Policies Active</div>
            <div class="stat-value" id="policy-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Violations</div>
            <div class="stat-value" id="violations-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Enforcement Rate</div>
            <div class="stat-value" id="enforcement-rate">0%</div>
        </div>
    </div>

    <div class="policies-section">
        <h3>Active Policies</h3>
        <div class="policies-list" id="policies-list">
            <div class="empty-state">Loading policies...</div>
        </div>
    </div>
</div>

<style>
.policy-enforcement-module {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.policy-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
}

.stat-card {
    background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
    border: 1px solid #16477f;
    border-radius: 6px;
    padding: 1.5rem;
    text-align: center;
}

.stat-label {
    color: #888;
    font-size: 0.85rem;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
}

.stat-value {
    font-size: 2rem;
    font-weight: bold;
    color: #14b8a6;
}

.policies-section h3 {
    color: #e8e8e8;
    margin-bottom: 1rem;
}

.policies-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.policy-item {
    background: linear-gradient(90deg, rgba(20, 184, 166, 0.1) 0%, transparent 100%);
    border-left: 3px solid #14b8a6;
    border-radius: 4px;
    padding: 0.75rem;
    font-size: 0.9rem;
    color: #a8a8a8;
}

.policy-name {
    color: #e8e8e8;
    font-weight: 600;
    margin-bottom: 0.25rem;
}

.policy-status {
    font-size: 0.85rem;
    color: #666;
}

.empty-state {
    text-align: center;
    color: #666;
    padding: 2rem;
}
</style>

<script>
class PolicyEnforcementController extends BaseModuleController {
    async loadData() {
        const response = await fetch('/api/modules/policy-enforcement');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    }

    startLiveUpdates() {
        this.updatePolicies();
        this.pollInterval = setInterval(() => {
            this.loadData()
                .then(data => this.updatePolicies())
                .catch(error => console.error('Poll failed:', error));
        }, 3000);
    }

    async updatePolicies() {
        const data = await this.loadData();
        const policies = data.data.policies || [];
        
        document.getElementById('policy-count').textContent = policies.length;
        document.getElementById('violations-count').textContent = data.data.violations || 0;
        document.getElementById('enforcement-rate').textContent = 
            Math.round((data.data.enforcement_rate || 0) * 100) + '%';

        const list = document.getElementById('policies-list');
        if (policies.length === 0) {
            list.innerHTML = '<div class="empty-state">No policies</div>';
            return;
        }

        list.innerHTML = policies.slice(0, 8).map(policy => `
            <div class="policy-item">
                <div class="policy-name">${policy.name || 'Policy'}</div>
                <div class="policy-status">Enforcement: ${policy.enforcement_status || 'Active'}</div>
            </div>
        `).join('');
    }

    onClose() {
        if (this.pollInterval) clearInterval(this.pollInterval);
        super.onClose();
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        const controller = new PolicyEnforcementController('module-content');
        controller.init();
    });
} else {
    const controller = new PolicyEnforcementController('module-content');
    controller.init();
}
</script>
{% endblock %}
