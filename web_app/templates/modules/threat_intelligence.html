{% extends "modules/base_module.html" %}

{% block module_content %}
<div class="threat-intel-module">
    <div class="intel-stats">
        <div class="stat-card">
            <div class="stat-label">IOCs Matched</div>
            <div class="stat-value" id="ioc-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Feeds Active</div>
            <div class="stat-value" id="feeds-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Updates Today</div>
            <div class="stat-value" id="updates-count">0</div>
        </div>
    </div>

    <div class="feeds-section">
        <h3>Threat Intelligence Feeds</h3>
        <div class="feeds-list" id="feeds-list">
            <div class="empty-state">Loading feeds...</div>
        </div>
    </div>
</div>

<style>
.threat-intel-module {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.intel-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
}

.stat-card {
    background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
    border: 1px solid #16477f;
    border-radius: 6px;
    padding: 1.5rem;
    text-align: center;
}

.stat-label {
    color: #888;
    font-size: 0.85rem;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
}

.stat-value {
    font-size: 2rem;
    font-weight: bold;
    color: #f76707;
}

.feeds-section h3 {
    color: #e8e8e8;
    margin-bottom: 1rem;
}

.feeds-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.feed-item {
    background: linear-gradient(90deg, rgba(247, 103, 7, 0.1) 0%, transparent 100%);
    border-left: 3px solid #f76707;
    border-radius: 4px;
    padding: 0.75rem;
    font-size: 0.9rem;
    color: #a8a8a8;
}

.feed-name {
    color: #e8e8e8;
    font-weight: 600;
    margin-bottom: 0.25rem;
}

.feed-status {
    font-size: 0.85rem;
    color: #666;
}

.empty-state {
    text-align: center;
    color: #666;
    padding: 2rem;
}

@keyframes slideIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>

<script>
class ThreatIntelController extends BaseModuleController {
    async loadData() {
        const response = await fetch('/api/modules/threat-intelligence');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    }

    startLiveUpdates() {
        this.updateThreatIntel();
        this.pollInterval = setInterval(() => {
            this.loadData()
                .then(data => this.updateThreatIntel())
                .catch(error => console.error('Poll failed:', error));
        }, 5000);
    }

    async updateThreatIntel() {
        const data = await this.loadData();
        const feeds = data.data.feeds || [];
        
        document.getElementById('ioc-count').textContent = data.data.ioc_count || 0;
        document.getElementById('feeds-count').textContent = feeds.length;
        document.getElementById('updates-count').textContent = data.data.updates_today || 0;

        const list = document.getElementById('feeds-list');
        if (feeds.length === 0) {
            list.innerHTML = '<div class="empty-state">No feeds active</div>';
            return;
        }

        list.innerHTML = feeds.map(feed => `
            <div class="feed-item">
                <div class="feed-name">${feed.name || 'Unknown'}</div>
                <div class="feed-status">Last update: ${feed.last_update || 'N/A'}</div>
            </div>
        `).join('');
    }

    onClose() {
        if (this.pollInterval) clearInterval(this.pollInterval);
        super.onClose();
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        const controller = new ThreatIntelController('module-content');
        controller.init();
    });
} else {
    const controller = new ThreatIntelController('module-content');
    controller.init();
}
</script>
{% endblock %}
