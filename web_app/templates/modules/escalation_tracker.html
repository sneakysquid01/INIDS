{% extends "modules/base_module.html" %}

{% block module_content %}
<div class="escalation-tracker-module">
    <div class="escalation-stats">
        <div class="stat-card">
            <div class="stat-label">Total Incidents</div>
            <div class="stat-value" id="incident-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Escalated</div>
            <div class="stat-value" id="escalated-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Resolved</div>
            <div class="stat-value" id="resolved-count">0</div>
        </div>
    </div>

    <div class="incidents-section">
        <h3>Active Incidents</h3>
        <div class="incidents-list" id="incidents-list">
            <div class="empty-state">No incidents</div>
        </div>
    </div>
</div>

<style>
.escalation-tracker-module {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.escalation-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
}

.stat-card {
    background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
    border: 1px solid #16477f;
    border-radius: 6px;
    padding: 1.5rem;
    text-align: center;
}

.stat-label {
    color: #888;
    font-size: 0.85rem;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
}

.stat-value {
    font-size: 2rem;
    font-weight: bold;
    color: #f43f5e;
}

.incidents-section h3 {
    color: #e8e8e8;
    margin-bottom: 1rem;
}

.incidents-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.incident-item {
    background: linear-gradient(90deg, rgba(244, 63, 94, 0.1) 0%, transparent 100%);
    border-left: 3px solid #f43f5e;
    border-radius: 4px;
    padding: 0.75rem;
    font-size: 0.9rem;
    color: #a8a8a8;
}

.incident-title {
    color: #e8e8e8;
    font-weight: 600;
    margin-bottom: 0.25rem;
}

.incident-level {
    font-size: 0.85rem;
    color: #f43f5e;
    text-transform: uppercase;
}

.empty-state {
    text-align: center;
    color: #666;
    padding: 2rem;
}
</style>

<script>
class EscalationTrackerController extends BaseModuleController {
    async loadData() {
        const response = await fetch('/api/modules/escalation-tracker');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    }

    startLiveUpdates() {
        this.updateEscalation();
        this.pollInterval = setInterval(() => {
            this.loadData()
                .then(data => this.updateEscalation())
                .catch(error => console.error('Poll failed:', error));
        }, 3000);
    }

    async updateEscalation() {
        const data = await this.loadData();
        const incidents = data.data.incidents || [];
        
        document.getElementById('incident-count').textContent = incidents.length;
        document.getElementById('escalated-count').textContent = 
            incidents.filter(i => i.escalated).length;
        document.getElementById('resolved-count').textContent = 
            incidents.filter(i => i.resolved).length;

        const list = document.getElementById('incidents-list');
        if (incidents.length === 0) {
            list.innerHTML = '<div class="empty-state">No active incidents</div>';
            return;
        }

        list.innerHTML = incidents.slice(0, 8).map(incident => `
            <div class="incident-item">
                <div class="incident-title">${incident.title || 'Incident'}</div>
                <div class="incident-level">${incident.severity || 'MEDIUM'}</div>
            </div>
        `).join('');
    }

    onClose() {
        if (this.pollInterval) clearInterval(this.pollInterval);
        super.onClose();
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        const controller = new EscalationTrackerController('module-content');
        controller.init();
    });
} else {
    const controller = new EscalationTrackerController('module-content');
    controller.init();
}
</script>
{% endblock %}
