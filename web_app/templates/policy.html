{% extends "base.html" %}

{% block title %}Policies — INIDS 3.0{% endblock %}
{% block page_title %}Policies{% endblock %}

{% block content %}
<div class="flex flex-col h-screen bg-[#0a0c10]">
    <!-- PAGE HEADER -->
    <div class="mb-6">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-white font-syne">Policies</h1>
                <p class="text-[#8f9099] text-sm mt-1">Security policy configuration and audit history</p>
            </div>
            <div id="policy-stats" class="flex gap-4">
                <div class="bg-[#151922] border border-[#1a1f2e] rounded-lg px-4 py-2">
                    <div class="text-[#8f9099] text-xs uppercase tracking-wider">Total Changes</div>
                    <div id="stat-changes" class="text-2xl font-bold text-white mt-1">0</div>
                </div>
                <div class="bg-[#151922] border border-[#1a1f2e] rounded-lg px-4 py-2">
                    <div class="text-[#8f9099] text-xs uppercase tracking-wider">Last Modified</div>
                    <div id="stat-last" class="text-sm font-semibold text-white mt-1">—</div>
                </div>
            </div>
        </div>
    </div>

    <!-- FILTER BAR -->
    <div class="bg-[#151922] border border-[#1a1f2e] rounded-lg p-4 mb-6">
        <div class="grid grid-cols-2 gap-4">
            <!-- POLICY TYPE FILTERS -->
            <div>
                <div class="text-xs font-semibold text-[#8f9099] uppercase tracking-wider mb-3">Policy Type</div>
                <div id="policy-filters" class="flex flex-wrap gap-2">
                    <button class="policy-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#3b82f6] active:bg-[#3b82f6]" data-policy="all">All Policies</button>
                    <button class="policy-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#ef4444]" data-policy="block">Block Rules</button>
                    <button class="policy-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#10b981]" data-policy="alert">Alert Rules</button>
                    <button class="policy-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#f59e0b]" data-policy="quarantine">Quarantine</button>
                </div>
            </div>

            <!-- CHANGE TYPE FILTERS -->
            <div>
                <div class="text-xs font-semibold text-[#8f9099] uppercase tracking-wider mb-3">Change Type</div>
                <div id="change-filters" class="flex flex-wrap gap-2">
                    <button class="change-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#3b82f6] active:bg-[#3b82f6]" data-change="all">All Changes</button>
                    <button class="change-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#10b981]" data-change="create">Create</button>
                    <button class="change-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#3b82f6]" data-change="update">Update</button>
                    <button class="change-filter px-3 py-1.5 bg-[#0a0c10] border border-[#1a1f2e] rounded text-sm text-white hover:border-[#ef4444]" data-change="delete">Delete</button>
                </div>
            </div>
        </div>

        <!-- SEARCH INPUT -->
        <div class="mt-4">
            <input 
                id="search-policies" 
                type="text" 
                placeholder="Search by policy name, user, or description..."
                class="w-full px-3 py-2 bg-[#0a0c10] border border-[#1a1f2e] rounded text-white text-sm placeholder-[#6b7280] focus:outline-none focus:border-[#3b82f6]"
            />
        </div>
    </div>

    <!-- POLICY HISTORY CONTAINER -->
    <div class="flex-1 overflow-y-auto">
        <div id="policies-list" class="space-y-4 pb-6">
            <!-- PolicyHistoryItem components mount here -->
        </div>
    </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/pages/policy.page.js') }}"></script>
{% endblock %}
