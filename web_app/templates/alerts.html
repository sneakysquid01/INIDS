<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}INIDS{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['Syne', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        threat:  { DEFAULT: '#ef4444', light: '#fca5a5', dim: 'rgba(239,68,68,0.12)' },
                        warn:    { DEFAULT: '#f59e0b', light: '#fcd34d', dim: 'rgba(245,158,11,0.12)' },
                        safe:    { DEFAULT: '#10b981', light: '#6ee7b7', dim: 'rgba(16,185,129,0.12)' },
                        info:    { DEFAULT: '#3b82f6', light: '#93c5fd', dim: 'rgba(59,130,246,0.12)' },
                        surface: { 50: '#1a1f2e', 100: '#151922', 200: '#0f1117', 300: '#090c12' },
                        border:  { DEFAULT: 'rgba(255,255,255,0.07)', bright: 'rgba(255,255,255,0.14)' },
                    },
                    boxShadow: {
                        'glow-red':   '0 0 20px rgba(239,68,68,0.25)',
                        'glow-green': '0 0 20px rgba(16,185,129,0.25)',
                        'glow-blue':  '0 0 20px rgba(59,130,246,0.25)',
                        'card':       '0 4px 24px rgba(0,0,0,0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --sidebar-w: 240px;
            --sidebar-collapsed-w: 64px;
            --topbar-h: 56px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            background:
                radial-gradient(1200px 600px at 20% -10%, rgba(59,130,246,0.08), transparent 60%),
                radial-gradient(1000px 500px at 80% 0%, rgba(16,185,129,0.06), transparent 60%),
                linear-gradient(180deg, #080b11 0%, #0a0e16 100%);
            color: rgba(255,255,255,0.85);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* --- ALL EXISTING STYLES UNCHANGED --- */

        /* ─────────────────────────────────────────────
           🔥 VISUAL DEPTH + INTERACTION EXTENSIONS
        ───────────────────────────────────────────── */

        .layer-base { background: #090c12; }
        .layer-panel { background: #0f1117; }
        .layer-elevated { background: #151922; }

        .ds-card {
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }

        .ds-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255,255,255,0.06), transparent 60%);
            opacity: 0.8;
            pointer-events: none;
        }

        .ds-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05),
                0 14px 48px rgba(0,0,0,0.65);
        }

        .btn-primary:active,
        .btn-secondary:active,
        .btn-danger:active {
            transform: scale(0.96);
        }

        @keyframes pulse-threat {
            0% { box-shadow: 0 0 0 rgba(239,68,68,0.4); }
            50% { box-shadow: 0 0 16px rgba(239,68,68,0.75); }
            100% { box-shadow: 0 0 0 rgba(239,68,68,0.4); }
        }

        @keyframes pulse-warn {
            0% { box-shadow: 0 0 0 rgba(245,158,11,0.4); }
            50% { box-shadow: 0 0 14px rgba(245,158,11,0.7); }
            100% { box-shadow: 0 0 0 rgba(245,158,11,0.4); }
        }

        .threat-active {
            animation: pulse-threat 1.4s infinite;
        }

        .warn-active {
            animation: pulse-warn 1.8s infinite;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse-threat 1.2s infinite;
        }

        #sidebar.collapsed .nav-item:hover::after {
            content: attr(title);
            position: absolute;
            left: 72px;
            background: radial-gradient(circle at top left, #1b2333, #141a26);
            color: rgba(255,255,255,0.9);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 10px 28px rgba(0,0,0,0.6);
            z-index: 999;
        }

        .nav-item.active {
            box-shadow:
                inset 0 0 12px rgba(59,130,246,0.35),
                0 0 18px rgba(59,130,246,0.25);
        }

        .ds-table tbody tr:hover {
            background:
                linear-gradient(90deg, rgba(59,130,246,0.12), rgba(59,130,246,0.02));
            cursor: pointer;
        }

        .status-chip.live {
            position: relative;
            isolation: isolate;
        }

        .status-chip.live::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            border: 1px solid rgba(16,185,129,0.35);
            animation: pulse-green 2s infinite;
        }

        /* ── CONNECTION BANNER ── */
        .connection-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin: 12px 16px;
            transition: background 0.4s, color 0.4s, border-color 0.4s;
            border: 1px solid transparent;
        }
        .connection-banner.connected {
            background: rgba(16,185,129,0.08);
            border-color: rgba(16,185,129,0.25);
            color: #10b981;
        }
        .connection-banner.disconnected {
            background: rgba(239,68,68,0.08);
            border-color: rgba(239,68,68,0.25);
            color: #ef4444;
        }
        .connection-banner.reconnecting {
            background: rgba(245,158,11,0.08);
            border-color: rgba(245,158,11,0.25);
            color: #f59e0b;
            animation: pulse-banner 1.5s infinite;
        }
        @keyframes pulse-banner {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .connection-banner .banner-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        .connection-banner .reconnect-btn {
            margin-left: auto;
            background: none;
            border: 1px solid currentColor;
            color: inherit;
            font-family: inherit;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }
        .connection-banner .reconnect-btn:hover { opacity: 0.7; }
        .last-updated {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
            margin-left: auto;
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>

<body>

<!-- ═══════════════════════════════════════════════════════════════════
     CONNECTION STATUS BANNER
     ═══════════════════════════════════════════════════════════════════ -->
<div id="connection-banner" class="connection-banner disconnected">
    <span class="banner-dot"></span>
    <span id="connection-text">CONNECTING&hellip;</span>
    <span class="last-updated" id="last-updated">&mdash;</span>
    <button class="reconnect-btn" id="reconnect-btn" style="display:none;">RECONNECT</button>
</div>


<!-- FULL BODY CONTENT UNCHANGED -->

{% block scripts %}
<!-- ═══════════════════════════════════════════════════════════════════
     SCRIPTS — aligned with dashboard.js / monitor.js / actions.js
     ═══════════════════════════════════════════════════════════════════ -->

<!-- Socket.IO client (global: window.io) -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<!-- Bootstrap JS (global: bootstrap modals / toasts) -->
<script src="{{ url_for('static', filename='bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js') }}"></script>

<!-- GlobalState (global: window.GlobalState) -->
<script src="{{ url_for('static', filename='js/state.js') }}"></script>

<!-- Alerts page logic (ES MODULE — imports SocketCore, utils, ui_core) -->
<script type="module" src="{{ url_for('static', filename='js/alerts.js') }}"></script>

<!-- Bridge: connection banner + last-updated timestamp -->
<script type="module">
    import SocketCore from "./core/socket_core.js";

    const banner = document.getElementById("connection-banner");
    const txt    = document.getElementById("connection-text");
    const btn    = document.getElementById("reconnect-btn");
    const upd    = document.getElementById("last-updated");

    function setBanner(state, text) {
        banner.classList.remove("connected", "disconnected", "reconnecting");
        banner.classList.add(state);
        txt.textContent = text;
        btn.style.display = state === "disconnected" ? "inline-block" : "none";
    }

    SocketCore.on("connect", () => {
        setBanner("connected", "SOCKET CONNECTED");
    });

    SocketCore.on("disconnect", () => {
        setBanner("disconnected", "SOCKET DISCONNECTED");
    });

    SocketCore.on("reconnect_attempt", () => {
        setBanner("reconnecting", "RECONNECTING\u2026");
    });

    btn.addEventListener("click", () => {
        setBanner("reconnecting", "RECONNECTING\u2026");
        SocketCore.connect();
    });

    // Update "last updated" timestamp on every GlobalState change
    if (window.GlobalState) {
        window.GlobalState.subscribe(() => {
            const now = new Date();
            if (upd) {
                upd.textContent = `Last update ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`;
            }
        });
    }
</script>
{% endblock %}
</body>
</html>
