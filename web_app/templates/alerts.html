{% extends "base.html" %}

{% block title %}Alerts — INIDS 3.0{% endblock %}
{% block page_title %}Alerts{% endblock %}

{% block content %}
<!-- PAGE HEADER -->
<div class="page-header mb-6">
    <div>
        <h1 class="text-3xl font-bold text-white">Security Alerts</h1>
        <p class="text-gray-400 text-sm mt-1">Real-time threat detection and response</p>
    </div>
    <div class="flex items-center gap-2">
        <span class="text-xs font-mono text-gray-500">
            <span id="alert-count" class="font-bold text-red-400">0</span> alerts
        </span>
    </div>
</div>

<!-- FILTER BAR -->
<div class="bg-[#151922] border border-[#1a1f2e] rounded-lg p-4 mb-6">
    <div class="flex flex-wrap items-center gap-3">
        <!-- Severity Filters -->
        <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400 font-mono uppercase tracking-wide">Severity:</span>
            <div id="severity-filters" class="flex gap-2">
                <button class="severity-filter active" data-severity="all" title="Show all alerts">
                    <span class="px-3 py-1 bg-blue-500/20 text-blue-400 border border-blue-500/50 rounded text-xs font-mono">ALL</span>
                </button>
                <button class="severity-filter" data-severity="critical" title="Filter by critical">
                    <span class="px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/50 rounded text-xs font-mono">CRITICAL</span>
                </button>
                <button class="severity-filter" data-severity="high" title="Filter by high">
                    <span class="px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/50 rounded text-xs font-mono">HIGH</span>
                </button>
                <button class="severity-filter" data-severity="medium" title="Filter by medium">
                    <span class="px-3 py-1 bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 rounded text-xs font-mono">MEDIUM</span>
                </button>
                <button class="severity-filter" data-severity="low" title="Filter by low">
                    <span class="px-3 py-1 bg-gray-500/20 text-gray-400 border border-gray-500/50 rounded text-xs font-mono">LOW</span>
                </button>
            </div>
        </div>

        <!-- Search Box -->
        <div class="ml-auto flex items-center gap-2">
            <input 
                type="text" 
                id="search-alerts" 
                placeholder="Search alerts..."
                class="px-3 py-1 bg-gray-900 border border-gray-700 rounded text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
            />
        </div>
    </div>
</div>

<!-- ALERTS CONTAINER -->
<div id="alerts-list" class="space-y-4">
    <!-- AlertCard components mount here -->
    <div class="text-center py-12 text-gray-500">
        <i class="bi bi-inbox text-4xl mb-4 block"></i>
        <p class="text-sm">Loading alerts...</p>
    </div>
</div>

<!-- BULK ACTIONS (shown when alerts selected) -->
<div id="bulk-actions-bar" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-[#151922] border border-blue-500/50 rounded-lg p-4 flex items-center gap-4 shadow-2xl">
    <span id="selected-count" class="text-sm font-mono text-blue-400">0 selected</span>
    <div class="flex gap-2">
        <button id="bulk-block-btn" class="px-4 py-2 bg-red-500/20 text-red-400 border border-red-500/50 rounded text-xs font-mono hover:bg-red-500/30 transition">
            BLOCK ALL
        </button>
        <button id="bulk-dismiss-btn" class="px-4 py-2 bg-gray-500/20 text-gray-400 border border-gray-500/50 rounded text-xs font-mono hover:bg-gray-500/30 transition">
            DISMISS
        </button>
        <button id="bulk-cancel-btn" class="px-4 py-2 bg-gray-600/20 text-gray-400 border border-gray-600/50 rounded text-xs font-mono hover:bg-gray-600/30 transition">
            CANCEL
        </button>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/alerts.page.js') }}"></script>
{% endblock %}
